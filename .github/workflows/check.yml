name: Arbitre checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Tests
        shell: Rscript {0}
        run: testthat::test_dir('tests/testthat', stop_on_failure = TRUE)
      - name: Load application
        run: Rscript scripts/smoke.R
      - name: Check public files
        shell: bash
        run: |
          if git ls-files | grep -E '(^telemetry/|\.pdf$|(^|/)\.env($|\.)|(^|/)\.dev.vars$)'; then exit 1; fi
